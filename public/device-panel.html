<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Light Control Panel</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			:root {
				/* One set of fluid tokens drives spacing/radius everywhere, so the
				   layout scales smoothly instead of snapping between vh values. */
				--gap: clamp(0.75rem, 2.2vmin, 1.75rem);
				--pad: clamp(1rem, 3vmin, 2.5rem);
				--radius: clamp(0.5rem, 1.5vmin, 1rem);
				--surface: rgba(255, 255, 255, 0.05);
				--surface-hover: rgba(255, 255, 255, 0.12);
				--border-col: rgba(255, 255, 255, 0.18);
			}

			html {
				-webkit-text-size-adjust: 100%;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
				color: #fff;
				min-height: 100dvh;
			}

			/* Full-bleed: fills the viewport edge-to-edge, no card/border/shadow.
			   Flex column with min-height (not fixed height) means it fills large
			   screens but can grow and scroll on short ones. */
			.panel {
				min-height: 100dvh;
				width: 100%;
				padding: max(var(--pad), env(safe-area-inset-top))
					max(var(--pad), env(safe-area-inset-right))
					max(var(--pad), env(safe-area-inset-bottom))
					max(var(--pad), env(safe-area-inset-left));
				display: flex;
				flex-direction: column;
				gap: var(--gap);
			}

			/* Connection status: idle (grey) -> ok (green) / error (red), reflecting
			   whether the last command reached the server. */
			.status-dot {
				position: fixed;
				top: max(0.75rem, env(safe-area-inset-top));
				right: max(0.75rem, env(safe-area-inset-right));
				width: 0.75rem;
				height: 0.75rem;
				border-radius: 50%;
				background: #7a8296;
				box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.25);
				transition: background 0.3s ease, box-shadow 0.3s ease;
				z-index: 10;
				pointer-events: none;
			}

			.status-dot.ok {
				background: #4caf50;
				box-shadow: 0 0 8px rgba(76, 175, 80, 0.7);
			}

			.status-dot.error {
				background: #ff5555;
				box-shadow: 0 0 8px rgba(255, 85, 85, 0.85);
			}

			/* Row 1: Colors (power toggle now lives at the very top of the panel) */
			.row-1 {
				flex: 1 1 0;
				display: grid;
				grid-template-columns: 1fr;
				gap: var(--gap);
				min-height: 0;
			}

			/* Power toggle pinned to the very top of the panel — compact, doesn't
			   stretch to fill like the rows below it. */
			.power-container {
				flex: 0 0 auto;
			}

			.power-container .power-toggle {
				flex: 0 0 auto;
			}

			.colors-container {
				display: grid;
				grid-template-rows: auto 1fr;
				gap: var(--gap);
				min-height: 0;
			}

			.section-title {
				font-size: clamp(0.7rem, 1.6vmin, 1rem);
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				opacity: 0.6;
			}

			.colors-grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				grid-template-rows: 1fr 1fr;
				gap: var(--gap);
				min-height: 0;
			}

			.color-btn {
				border: 1px solid var(--border-col);
				border-radius: var(--radius);
				background: var(--surface);
				cursor: pointer;
				position: relative;
				overflow: hidden;
				min-height: 3rem;
				/* Transition only what changes — never `all` — to avoid the browser
				   tracking layout properties on every interaction. */
				transition: transform 0.15s ease, border-color 0.15s ease;
				touch-action: manipulation;
				-webkit-tap-highlight-color: transparent;
			}

			.color-btn::before {
				content: '';
				position: absolute;
				inset: 0;
				opacity: 0.9;
			}

			.color-btn:active {
				transform: scale(0.97);
			}

			.color-btn:hover {
				border-color: rgba(255, 255, 255, 0.45);
			}

			.color-btn.red::before {
				background: #ff4444;
			}
			.color-btn.orange::before {
				background: #ff8c00;
			}
			.color-btn.custom::before {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			}

			.power-container {
				display: flex;
				flex-direction: column;
				align-items: stretch;
				gap: var(--gap);
				min-height: 0;
			}

			.power-toggle {
				--toggle-pad: clamp(0.4rem, 1vmin, 0.9rem);
				width: 100%;
				flex: 1;
				min-height: clamp(3rem, 9vmin, 5.5rem);
				background: rgba(255, 255, 255, 0.1);
				border-radius: 999px;
				border: 1px solid var(--border-col);
				cursor: pointer;
				transition: background 0.3s ease, border-color 0.3s ease;
				display: flex;
				align-items: center;
				padding: var(--toggle-pad);
				/* none so a horizontal drag on the knob doesn't scroll the page. */
				touch-action: none;
				user-select: none;
				-webkit-user-select: none;
				-webkit-tap-highlight-color: transparent;
			}

			.power-toggle.on {
				background: rgba(76, 175, 80, 0.3);
				border-color: rgba(76, 175, 80, 0.55);
			}

			.power-toggle-knob {
				width: calc(50% - var(--toggle-pad));
				height: 100%;
				background: #fff;
				border-radius: 999px;
				cursor: grab;
				transition: transform 0.3s ease;
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
			}

			.power-toggle.on .power-toggle-knob {
				transform: translateX(calc(100% + var(--toggle-pad) * 2));
			}

			/* While dragging: kill the transition so the knob tracks the pointer 1:1. */
			.power-toggle.dragging {
				cursor: grabbing;
			}

			.power-toggle.dragging .power-toggle-knob {
				cursor: grabbing;
				transition: none;
			}

			.power-toggle:focus-visible {
				outline: none;
				box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.4);
			}

			/* Row 2: Brightness */
			.row-2 {
				flex: 1 1 0;
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: var(--gap);
				min-height: 0;
			}

			.brightness-btn {
				border: 1px solid var(--border-col);
				border-radius: var(--radius);
				background: var(--surface);
				color: #fff;
				font-size: clamp(0.85rem, 1.8vmin, 1.25rem);
				font-weight: 500;
				cursor: pointer;
				transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: clamp(0.5rem, 1.5vmin, 1rem);
				min-height: 3.5rem;
				touch-action: manipulation;
				-webkit-tap-highlight-color: transparent;
			}

			.brightness-btn:active {
				transform: scale(0.97);
			}

			.brightness-btn:hover {
				background: var(--surface-hover);
			}

			.brightness-btn.selected {
				background: rgba(255, 180, 76, 0.18);
				border-color: rgba(255, 180, 76, 0.85);
				box-shadow: 0 0 0 1px rgba(255, 180, 76, 0.55), 0 0 20px rgba(255, 180, 76, 0.25);
				color: #ffd9a3;
			}

			.icon {
				width: clamp(2rem, 5vmin, 3rem);
				height: clamp(2rem, 5vmin, 3rem);
			}

			/* Optimistic-UI failure feedback: a brief red flash shown when a
			   command didn't land and the control rolled back to its real state. */
			.error-flash {
				animation: errorFlash 0.5s ease;
			}

			@keyframes errorFlash {
				0%,
				100% {
					border-color: var(--border-col);
				}
				40% {
					border-color: #ff5555;
					background: rgba(255, 85, 85, 0.22);
				}
			}

			/* Toggle is disabled while its request is in flight (prevents desync
			   from rapid taps); dim it so the wait is visible. */
			.power-toggle.busy {
				opacity: 0.7;
				cursor: progress;
			}

			/* Row 3: Temperature Slider — equal-height band; the slider fills it. */
			.row-3 {
				flex: 1 1 0;
				min-height: 0;
				display: flex;
				flex-direction: column;
				gap: var(--gap);
			}

			.slider-container {
				flex: 1;
				min-height: 0;
				display: flex;
				flex-direction: column;
				gap: clamp(0.4rem, 1vmin, 0.75rem);
			}

			.slider-wrap {
				--pct: 50%;
				position: relative;
				flex: 1;
				min-height: clamp(2.5rem, 4.5vmin, 3.5rem);
				/* Squared-off (not pill): sharper corners, still softly rounded. */
				border-radius: var(--radius);
				/* Warm (amber) -> cool (white) temperature spectrum. */
				background: linear-gradient(to right, #ff9a56 0%, #ffffff 100%);
				border: 1px solid rgba(255, 255, 255, 0.15);
				box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.35);
				/* Clip the handle to the bar so it can never spill past the edges. */
				overflow: hidden;
				touch-action: none;
			}

			/* The native range fills the bar and handles interaction (click/drag
			   anywhere), but its thumb is hidden — the visible handle is the
			   crossbar overlay positioned by --pct. */
			.slider {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				margin: 0;
				background: transparent;
				border-radius: inherit;
				outline: none;
				-webkit-appearance: none;
				appearance: none;
				touch-action: none;
				cursor: pointer;
			}

			.slider::-webkit-slider-thumb {
				-webkit-appearance: none;
				appearance: none;
				width: 1px;
				height: 100%;
				background: transparent;
				cursor: grab;
			}

			.slider::-moz-range-thumb {
				width: 1px;
				height: 100%;
				border: none;
				background: transparent;
				cursor: grab;
			}

			.slider::-moz-range-track {
				background: transparent;
			}

			/* Vertical crossbar handle: locked to the bar's full height (top/bottom
			   pinned) with a fixed thickness. Its centre is clamped to
			   [half-width, 100% - half-width] so the whole handle always stays
			   inside the bar — it never spills past the left/right edge. */
			.slider-crossbar {
				--thumb-w: clamp(0.75rem, 2.5vmin, 1.25rem);
				position: absolute;
				top: 0;
				bottom: 0;
				width: var(--thumb-w);
				left: clamp(calc(var(--thumb-w) / 2), var(--pct), calc(100% - var(--thumb-w) / 2));
				transform: translateX(-50%);
				background: #fff;
				border: 2px solid rgba(0, 0, 0, 0.18);
				/* Sharper corners than the old pill — squared but not hard 90°. */
				border-radius: clamp(0.2rem, 0.6vmin, 0.4rem);
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
				pointer-events: none;
				transition: box-shadow 0.12s ease;
			}

			.slider:focus-visible ~ .slider-crossbar {
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35), 0 0 0 0.3rem rgba(255, 255, 255, 0.4);
			}

			.slider:active ~ .slider-crossbar {
				box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
			}

			.slider-labels {
				display: flex;
				justify-content: space-between;
				align-items: center;
				font-size: clamp(0.7rem, 1.6vmin, 1rem);
			}

			.slider-labels .label-end {
				opacity: 0.6;
			}

			/* Centre readout: the signed % (0% mid, -100% warm, +100% cool). */
			.slider-labels .label-value {
				font-variant-numeric: tabular-nums;
				font-weight: 600;
				opacity: 0.95;
			}

			/* Narrow screens: stack colors above power, collapse brightness to 2x2. */
			@media (max-width: 640px) {
				.row-1 {
					grid-template-columns: 1fr;
				}
				.row-2 {
					grid-template-columns: 1fr 1fr;
				}
				.power-toggle {
					height: 3.5rem;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				* {
					transition-duration: 0.01ms !important;
				}
			}
		</style>
	</head>
	<body>
		<div class="status-dot" id="statusDot" title="Not connected" aria-label="Not connected"></div>
		<div class="panel">
			<!-- Power toggle: pinned to the very top of the page -->
			<div class="power-container">
				<div
					class="power-toggle"
					id="powerToggle"
					role="switch"
					aria-checked="false"
					aria-label="Power"
					tabindex="0"
				>
					<div class="power-toggle-knob"></div>
				</div>
			</div>

			<!-- Row 1: Colors -->
			<div class="row-1">
				<div class="colors-container">
					<div class="section-title">Color Picker</div>
					<div class="colors-grid">
						<button class="color-btn red" onclick="setColor('red')" aria-label="Red"></button>
						<button
							class="color-btn orange"
							onclick="setColor('orange')"
							aria-label="Orange"
						></button>
						<button
							class="color-btn custom"
							onclick="setColor('custom1')"
							aria-label="Custom 1"
						></button>
						<button
							class="color-btn custom"
							onclick="setColor('custom2')"
							aria-label="Custom 2"
						></button>
					</div>
				</div>
			</div>

			<!-- Row 2: Brightness -->
			<div class="row-2">
				<button class="brightness-btn" data-brightness="10" onclick="setBrightness(10)">
					<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<circle cx="12" cy="12" r="5" />
					</svg>
					10%
				</button>
				<button class="brightness-btn" data-brightness="50" onclick="setBrightness(50)">
					<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<circle cx="12" cy="12" r="5" />
						<line x1="12" y1="1" x2="12" y2="3" />
						<line x1="12" y1="21" x2="12" y2="23" />
					</svg>
					50%
				</button>
				<button class="brightness-btn" data-brightness="75" onclick="setBrightness(75)">
					<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<circle cx="12" cy="12" r="5" />
						<line x1="12" y1="1" x2="12" y2="3" />
						<line x1="12" y1="21" x2="12" y2="23" />
						<line x1="1" y1="12" x2="3" y2="12" />
						<line x1="21" y1="12" x2="23" y2="12" />
					</svg>
					75%
				</button>
				<button class="brightness-btn" data-brightness="100" onclick="setBrightness(100)">
					<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<circle cx="12" cy="12" r="5" />
						<line x1="12" y1="1" x2="12" y2="3" />
						<line x1="12" y1="21" x2="12" y2="23" />
						<line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
						<line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
						<line x1="1" y1="12" x2="3" y2="12" />
						<line x1="21" y1="12" x2="23" y2="12" />
						<line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
						<line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
					</svg>
					100%
				</button>
			</div>

			<!-- Row 3: Color Temperature -->
			<div class="row-3">
				<div class="section-title">Color Temperature</div>
				<div class="slider-container">
					<div class="slider-wrap" id="tempWrap">
						<input
							type="range"
							min="0"
							max="100"
							value="50"
							class="slider"
							id="tempSlider"
							oninput="onTempInput(this.value)"
							onchange="onTempCommit(this.value)"
							aria-label="Color Temperature"
						/>
						<div class="slider-crossbar"></div>
					</div>
					<div class="slider-labels">
						<span class="label-end">Warm &minus;100%</span>
						<span class="label-value" id="tempValue">0%</span>
						<span class="label-end">Cool +100%</span>
					</div>
				</div>
			</div>
		</div>

		<script>
			const BASE_URL = window.location.origin;
			// Local state variables
			let isPowerOn = false;
			let currentBrightness = 50;
			let currentColorTemperature = 50;

			// Connection status dot: reflects whether the last command reached the
			// server (green) or failed (red).
			function setConnectionStatus(ok) {
				const dot = document.getElementById('statusDot');
				if (!dot) return;
				dot.classList.toggle('ok', ok);
				dot.classList.toggle('error', !ok);
				dot.title = ok ? 'Connected' : 'Last command failed';
				dot.setAttribute('aria-label', dot.title);
			}

			// Reusable GET request method. Resolves to true on success, false on a
			// non-OK response or network error, so callers can roll back the UI.
			function makeGetRequest(route) {
				const url = `${BASE_URL}${route}`;

				return fetch(url, {
					method: 'GET',
				})
					.then((response) => {
						if (response.ok) {
							console.log('Request successful:', route);
							setConnectionStatus(true);
							return true;
						}
						console.error('Request failed:', route);
						setConnectionStatus(false);
						return false;
					})
					.catch((error) => {
						console.error('Error making request:', error);
						setConnectionStatus(false);
						return false;
					});
			}

			// Briefly flash a control red — used when an optimistic update is rolled
			// back because the command didn't land.
			function flashError(el) {
				if (!el) return;
				el.classList.remove('error-flash');
				void el.offsetWidth; // force reflow so the animation restarts
				el.classList.add('error-flash');
				setTimeout(() => el.classList.remove('error-flash'), 600);
			}

			// Apply a server-reported state to local state + UI. Only applies values
			// the server actually returned, so a partial/error payload can't poison
			// local state with undefined/NaN.
			function applyServerState(s) {
				s = s || {};
				if (typeof s.on === 'boolean') isPowerOn = s.on;
				if (Number.isFinite(Number(s.brightness))) currentBrightness = Number(s.brightness);
				if (Number.isFinite(Number(s.colorTemperaturePct))) {
					currentColorTemperature = Number(s.colorTemperaturePct);
				}
				updatePowerToggle();
				updateBrightnessButtons();
				updateColorTemperatureSlider();
			}

			// Get initial state from server
			function getLivingRoomState() {
				const url = `${BASE_URL}/getLivingRoomState`;

				fetch(url, {
					method: 'GET',
				})
					.then((response) => {
						if (!response.ok) throw new Error(`state fetch failed (${response.status})`);
						return response.json();
					})
					.then((data) => {
						applyServerState(data && data.body);
						setConnectionStatus(true);
					})
					.catch((error) => {
						console.error('Error getting living room state:', error);
						setConnectionStatus(false);
					});
			}

			// --- Reconciliation polling ------------------------------------------
			// After every action, poll /syncLivingRoom on a backoff. Each poll the
			// backend forces drifted devices back to the last-entered state and
			// reports whether the room is synchronized. The chain:
			//   - restarts from the beginning on every new action, and
			//   - early-exits as soon as the backend reports synchronized.
			const RECONCILE_DELAYS = [3000, 6000, 10000, 15000];
			let reconcileTimer = null;

			function cancelReconcile() {
				if (reconcileTimer !== null) {
					clearTimeout(reconcileTimer);
					reconcileTimer = null;
				}
			}

			// One reconcile poll. Sends the frontend's current (last-entered) state as
			// the desired snapshot; the backend forces drifted devices to match it.
			// Returns true once the room is synchronized. Deliberately does NOT apply
			// the observed state back to the UI — the frontend's state is the source
			// of truth here, so a poll never overwrites what the user last entered.
			function pollSync() {
				const desired = {
					on: isPowerOn,
					brightness: currentBrightness,
					colorTemperaturePct: currentColorTemperature,
				};
				return fetch(`${BASE_URL}/syncLivingRoom`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(desired),
				})
					.then((response) => {
						setConnectionStatus(response.ok);
						if (!response.ok) return false;
						return response.json().then((data) => !!(data && data.synchronized));
					})
					.catch((error) => {
						console.error('Error polling sync:', error);
						setConnectionStatus(false);
						return false;
					});
			}

			function scheduleReconcileStep(i) {
				if (i >= RECONCILE_DELAYS.length) return;
				reconcileTimer = setTimeout(() => {
					reconcileTimer = null;
					pollSync().then((synchronized) => {
						if (synchronized) return; // early exit — room is in sync
						scheduleReconcileStep(i + 1);
					});
				}, RECONCILE_DELAYS[i]);
			}

			// Called after every action; a new action resets the chain.
			function startReconcile() {
				cancelReconcile();
				scheduleReconcileStep(0);
			}

			// Update power toggle UI
			function updatePowerToggle() {
				const toggle = document.getElementById('powerToggle');
				toggle.classList.toggle('on', isPowerOn);
				toggle.setAttribute('aria-checked', String(isPowerOn));
			}

			// Update brightness buttons UI
			function updateBrightnessButtons() {
				document.querySelectorAll('.brightness-btn').forEach((btn) => {
					const isSelected = Number(btn.dataset.brightness) === Number(currentBrightness);
					btn.classList.toggle('selected', isSelected);
				});
			}

			// Update color temperature slider UI
			function updateColorTemperatureSlider() {
				const slider = document.getElementById('tempSlider');
				slider.value = currentColorTemperature;
				updateTempFill();
			}

			// Map the raw 0..100 slider position to a signed display percentage:
			// 0 -> -100%, 50 -> 0%, 100 -> +100%. Position/network still use 0..100.
			function formatTempPct(raw) {
				const n = Number.isFinite(Number(raw)) ? Number(raw) : 50;
				const signed = Math.round(n * 2 - 100);
				return `${signed > 0 ? '+' : ''}${signed}%`;
			}

			// Move the fill boundary + crossbar to match the current value, and
			// refresh the centre readout.
			function updateTempFill() {
				const wrap = document.getElementById('tempWrap');
				const pct = Number(currentColorTemperature);
				if (wrap) wrap.style.setProperty('--pct', `${Number.isFinite(pct) ? pct : 50}%`);
				const readout = document.getElementById('tempValue');
				if (readout) readout.textContent = formatTempPct(currentColorTemperature);
			}

			// Power toggle: optimistic flip, guarded against overlapping requests,
			// rolls back if the command fails.
			let powerBusy = false;

			function togglePower() {
				if (powerBusy) return;

				const toggle = document.getElementById('powerToggle');
				const previous = isPowerOn;

				// Optimistic: move the knob now.
				isPowerOn = !isPowerOn;
				updatePowerToggle();

				powerBusy = true;
				toggle.classList.add('busy');

				const route = isPowerOn ? '/turnOnLivingRoom' : '/turnOffLivingRoom';
				makeGetRequest(route).then((ok) => {
					powerBusy = false;
					toggle.classList.remove('busy');
					if (!ok) {
						// Roll back to the real state and flag the failure.
						isPowerOn = previous;
						updatePowerToggle();
						flashError(toggle);
					}
				});

				startReconcile();
			}

			function setColor(color) {
				// TODO: Replace ${BASE_URL} with your actual base URL
				const url = `${BASE_URL}/setLivingRoomColor`;

				fetch(url, {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
					body: JSON.stringify({ color: color }),
				})
					.then((response) => {
						if (response.ok) {
							console.log('Color set to:', color);
							setConnectionStatus(true);
						} else {
							console.error('Failed to set color');
							setConnectionStatus(false);
						}
					})
					.catch((error) => {
						console.error('Error setting color:', error);
						setConnectionStatus(false);
					});

				startReconcile();
			}

			// Brightness: optimistic highlight, rolls back if the command fails.
			function setBrightness(value) {
				const previous = currentBrightness;

				// Optimistic: highlight the tapped button now.
				currentBrightness = value;
				updateBrightnessButtons();

				makeGetRequest(`/setLivingRoomBrightness${value}`).then((ok) => {
					if (!ok) {
						currentBrightness = previous;
						updateBrightnessButtons();
						flashError(document.querySelector(`[data-brightness="${value}"]`));
					}
				});

				startReconcile();
			}

			// --- Color temperature: instant local feedback, commit-only network ---
			// Dragging updates the UI live but sends NOTHING; the single POST fires
			// only when the drag/keyboard change is committed (pointer up / key up),
			// so the worker and Govee API see exactly one request per adjustment.
			function sendColorTemperature(value) {
				const url = `${BASE_URL}/setLivingRoomColorTemp`;

				fetch(url, {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
					body: JSON.stringify({ pct: Number(value) }),
				})
					.then((response) => {
						if (response.ok) {
							console.log('Color temperature set to:', value);
							setConnectionStatus(true);
						} else {
							console.error('Failed to set color temperature');
							setConnectionStatus(false);
						}
					})
					.catch((error) => {
						console.error('Error setting color temperature:', error);
						setConnectionStatus(false);
					});
			}

			// Fired continuously while dragging — UI only, no network.
			function onTempInput(value) {
				currentColorTemperature = Number(value);
				updateTempFill();
			}

			// Fired once when the drag / keyboard change is committed — sends once.
			function onTempCommit(value) {
				currentColorTemperature = Number(value);
				sendColorTemperature(currentColorTemperature);
				startReconcile();
			}

			// Make the power toggle draggable (in addition to tap / keyboard).
			// A short press acts as a tap-toggle; a drag past the halfway point
			// commits the new state, otherwise it snaps back.
			(function initPowerToggleDrag() {
				const toggle = document.getElementById('powerToggle');
				const knob = toggle.querySelector('.power-toggle-knob');

				let dragging = false;
				let moved = false;
				let startX = 0;
				let maxTravel = 0;

				// Furthest the knob can slide: inner width minus the knob width.
				function travel() {
					const pad = parseFloat(getComputedStyle(toggle).paddingLeft) || 0;
					return toggle.clientWidth - pad * 2 - knob.offsetWidth;
				}

				function clampedX(clientX) {
					const base = isPowerOn ? maxTravel : 0;
					return Math.max(0, Math.min(maxTravel, base + (clientX - startX)));
				}

				toggle.addEventListener('pointerdown', (e) => {
					if (powerBusy) return;
					dragging = true;
					moved = false;
					startX = e.clientX;
					maxTravel = travel();
					toggle.classList.add('dragging');
					toggle.setPointerCapture(e.pointerId);
				});

				toggle.addEventListener('pointermove', (e) => {
					if (!dragging) return;
					if (Math.abs(e.clientX - startX) > 4) moved = true;
					knob.style.transform = `translateX(${clampedX(e.clientX)}px)`;
				});

				function endDrag(e) {
					if (!dragging) return;
					dragging = false;
					toggle.classList.remove('dragging');
					knob.style.transform = ''; // hand positioning back to CSS

					if (!moved) {
						togglePower(); // treated as a tap
						return;
					}

					const wantOn = clampedX(e.clientX) > maxTravel / 2;
					if (wantOn !== isPowerOn) {
						togglePower(); // commit + send + rollback-on-failure
					} else {
						updatePowerToggle(); // snap back to current state
					}
				}

				toggle.addEventListener('pointerup', endDrag);
				toggle.addEventListener('pointercancel', endDrag);

				// Keyboard: Space / Enter toggles (replaces the old onclick).
				toggle.addEventListener('keydown', (e) => {
					if (e.key === ' ' || e.key === 'Enter') {
						e.preventDefault();
						togglePower();
					}
				});
			})();

			// Load state on page load
			window.addEventListener('DOMContentLoaded', () => {
				getLivingRoomState();
			});
		</script>
	</body>
