name: DevicePanel

options:
  bundleIdPrefix: com.danieljomaa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic

targets:
  DevicePanelCore:
    type: framework
    platform: iOS
    sources:
      - DevicePanelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danieljomaa.devicepanel.core
        SKIP_INSTALL: true
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  DevicePanel:
    type: application
    platform: iOS
    sources:
      - DevicePanel
    dependencies:
      - target: DevicePanelCore
      - target: DevicePanelWidget
        embed: true
    entitlements:
      path: DevicePanel/DevicePanel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.danieljomaa.devicepanel
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.danieljomaa.devicepanel.shared
    info:
      path: DevicePanel/Info.plist
      properties:
        CFBundleDisplayName: Device Panel
        DevicePanelKeychainAccessGroup: $(AppIdentifierPrefix)com.danieljomaa.devicepanel.shared
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.danieljomaa.devicepanel
            CFBundleURLSchemes:
              - devicepanel
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danieljomaa.devicepanel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  DevicePanelWidget:
    type: app-extension
    platform: iOS
    sources:
      - DevicePanelWidget
    dependencies:
      - target: DevicePanelCore
      - target: DevicePanelWidgetSupport
    entitlements:
      path: DevicePanelWidget/DevicePanelWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.danieljomaa.devicepanel
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.danieljomaa.devicepanel.shared
    info:
      path: DevicePanelWidget/Info.plist
      properties:
        CFBundleDisplayName: Device Panel
        DevicePanelKeychainAccessGroup: $(AppIdentifierPrefix)com.danieljomaa.devicepanel.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danieljomaa.devicepanel.widget
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true

  DevicePanelWidgetSupport:
    type: framework
    platform: iOS
    sources:
      - DevicePanelWidgetSupport
    dependencies:
      - target: DevicePanelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danieljomaa.devicepanel.widget-support
        SKIP_INSTALL: true
        DEFINES_MODULE: true
        APPLICATION_EXTENSION_API_ONLY: true
        GENERATE_INFOPLIST_FILE: true

  DevicePanelCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DevicePanelCoreTests
    dependencies:
      - target: DevicePanelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danieljomaa.devicepanel.core-tests
        GENERATE_INFOPLIST_FILE: true

  DevicePanelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DevicePanelUITests
    dependencies:
      - target: DevicePanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danieljomaa.devicepanel.ui-tests
        GENERATE_INFOPLIST_FILE: true

  DevicePanelWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DevicePanelWidgetTests
    dependencies:
      - target: DevicePanelCore
      - target: DevicePanelWidgetSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danieljomaa.devicepanel.widget-tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  DevicePanel:
    build:
      targets:
        DevicePanel: all
        DevicePanelCore: [test]
        DevicePanelWidgetSupport: [test]
        DevicePanelWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DevicePanelCoreTests
        - DevicePanelWidgetTests
        - DevicePanelUITests
    archive:
      config: Release
