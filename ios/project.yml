name: DevicePanel

options:
  bundleIdPrefix: com.danieljomaa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic

targets:
  DevicePanelCore:
    type: framework
    platform: iOS
    sources:
      - DevicePanelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danieljomaa.devicepanel.core
        SKIP_INSTALL: true
        DEFINES_MODULE: true

  DevicePanel:
    type: application
    platform: iOS
    sources:
      - DevicePanel
    dependencies:
      - target: DevicePanelCore
    entitlements:
      path: DevicePanel/DevicePanel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.danieljomaa.devicepanel
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.danieljomaa.devicepanel.shared
    info:
      path: DevicePanel/Info.plist
      properties:
        CFBundleDisplayName: Device Panel
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danieljomaa.devicepanel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  DevicePanelCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DevicePanelCoreTests
    dependencies:
      - target: DevicePanelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danieljomaa.devicepanel.core-tests

schemes:
  DevicePanel:
    build:
      targets:
        DevicePanel: all
        DevicePanelCore: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DevicePanelCoreTests
    archive:
      config: Release
