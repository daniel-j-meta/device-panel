name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - "contracts/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "contracts/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build and test
        working-directory: ios
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable and (.name | startswith("iPhone")))] | first | .udid')
          test -n "$SIMULATOR_ID" && test "$SIMULATOR_ID" != "null"
          xcodebuild test \
            -project DevicePanel.xcodeproj \
            -scheme DevicePanel \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
