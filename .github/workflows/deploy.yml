name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

concurrency:
  group: deploy-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Upload the Worker's runtime secrets on each deploy so they stay in
          # sync. These are set from GitHub repository secrets below.
          secrets: |
            GOVEE_API_KEY
            PANEL_PASSWORD
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
